name: local_notifier
description: Local notifications for Flutter desktop apps. Windows only in this copy.
version: 0.1.6
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

  uuid: ">=3.0.7 <5.0.0"

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: LocalNotifierPlugin
