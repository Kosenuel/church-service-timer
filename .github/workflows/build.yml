name: Build and test

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_apk:
        description: Build the signed release APK (arm64) instead of a debug APK
        type: boolean
        default: true
      windows:
        description: Build the Windows app
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Tests and the APK build run side by side, so a run takes as long as the
# slower of the two. Pull requests build a quick debug APK to prove Android
# still compiles; main (and a manual run) build the signed release APK.
# Published releases are built by release.yml, for every processor type.
#
# The Windows build runs on a Windows runner, which uses private-repository
# minutes at twice the Linux rate. So it only runs when it can tell us
# something: on main, on a manual run, and on branches and pull requests
# that touch the Windows runner, the Windows code, the plugins or this
# workflow. Shared Dart code is already checked by the analyzer and tests.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.windows }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "windows=$WANTED" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -qE '^(windows/|lib/windows/|pubspec\.(yaml|lock)$|\.github/workflows/|android/app/src/main/assets/display_fonts/)'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_apk) }}
    steps:
      - uses: actions/checkout@v4

      # Gradle's downloads and build cache are kept between runs; without
      # them every run compiled the Android side from scratch.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::CST_KEYSTORE_BASE64 is not set. The APK is signed with a throwaway debug key and will not upgrade a previously installed build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CST_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 64-bit ARM covers practically every phone in use; release.yml still
      # builds all processor types for published releases.
      - name: Build release APK (arm64)
        if: env.RELEASE == 'true'
        env:
          CST_KEYSTORE_PASSWORD: ${{ secrets.CST_KEYSTORE_PASSWORD }}
          CST_KEY_ALIAS: ${{ secrets.CST_KEY_ALIAS }}
          CST_KEY_PASSWORD: ${{ secrets.CST_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Build debug APK (arm64)
        if: env.RELEASE != 'true'
        run: flutter build apk --debug --target-platform android-arm64

      # The App Bundle for Google Play (release.yml builds it for tagged
      # releases). Built here too, so a broken bundle shows up before tagging.
      - name: Build release App Bundle (Google Play)
        if: env.RELEASE == 'true'
        env:
          CST_KEYSTORE_PASSWORD: ${{ secrets.CST_KEYSTORE_PASSWORD }}
          CST_KEY_ALIAS: ${{ secrets.CST_KEY_ALIAS }}
          CST_KEY_PASSWORD: ${{ secrets.CST_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Build debug App Bundle (Google Play)
        if: env.RELEASE != 'true'
        run: flutter build appbundle --debug

      - name: Name the APK
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p dist
          if [ "$RELEASE" = "true" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/Church-Service-Timer-$version-arm64.apk"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/Church-Service-Timer-$version-arm64-debug.apk"
          fi
          if [ "$RELEASE" = "true" ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/Church-Service-Timer-$version.aab"
          fi
          sha256sum dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: church-service-timer-apk
          path: dist/*
          retention-days: 30

  # Proves the Windows app compiles and gives a build to try: unzip it
  # anywhere and run church_service_timer.exe. Not signed, so Windows
  # SmartScreen warns the first time (More info, then Run anyway).
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Zip the app folder
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$release/data/display_fonts/tinos/Tinos-Regular.ttf")) {
            throw 'The LED display fonts were not bundled.'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath "dist/Church-Service-Timer-$version-windows-x64.zip"
          Get-FileHash dist/* -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: church-service-timer-windows
          path: dist/*
          retention-days: 30
