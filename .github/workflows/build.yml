name: Build and test

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_apk:
        description: Build the signed release APK (arm64) instead of a debug APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Tests and the APK build run side by side, so a run takes as long as the
# slower of the two. Pull requests build a quick debug APK to prove Android
# still compiles; main (and a manual run) build the signed release APK.
# Published releases are built by release.yml, for every processor type.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_apk) }}
    steps:
      - uses: actions/checkout@v4

      # Gradle's downloads and build cache are kept between runs; without
      # them every run compiled the Android side from scratch.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::CST_KEYSTORE_BASE64 is not set. The APK is signed with a throwaway debug key and will not upgrade a previously installed build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CST_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 64-bit ARM covers practically every phone in use; release.yml still
      # builds all processor types for published releases.
      - name: Build release APK (arm64)
        if: env.RELEASE == 'true'
        env:
          CST_KEYSTORE_PASSWORD: ${{ secrets.CST_KEYSTORE_PASSWORD }}
          CST_KEY_ALIAS: ${{ secrets.CST_KEY_ALIAS }}
          CST_KEY_PASSWORD: ${{ secrets.CST_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Build debug APK (arm64)
        if: env.RELEASE != 'true'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Name the APK
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p dist
          if [ "$RELEASE" = "true" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/Church-Service-Timer-$version-arm64.apk"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/Church-Service-Timer-$version-arm64-debug.apk"
          fi
          sha256sum dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: church-service-timer-apk
          path: dist/*.apk
          retention-days: 30
