name: Publish to the guide site

# Copies a published app release (its signed APK, the Windows installer when
# the release has one, their checksums and the notes) to the public guide
# repository's Releases, which the guide site's Download button
# opens. The app repository is private, so this is where people download it.
#
# A pre-release (a tag such as v0.36.0-beta.1) is copied marked Pre-release
# and without the "latest" mark, so the guide's Download button and the
# app's Check for updates keep pointing at the last real release.
#
# Runs after every tagged release (called from release.yml), or by hand from
# the Actions tab for an earlier tag, for example v0.30.0.
#
# Needs the repository secret GUIDE_RELEASE_TOKEN: a fine-grained personal
# access token for ImmanuelOkose/church-service-timer-guide with
# "Contents: Read and write". Without it the job warns and does nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.30.0
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      GUIDE_RELEASE_TOKEN:
        required: false

permissions:
  contents: read

env:
  GUIDE_REPO: ImmanuelOkose/church-service-timer-guide

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the guide token
        id: token
        env:
          GUIDE_TOKEN: ${{ secrets.GUIDE_RELEASE_TOKEN }}
        run: |
          if [ -z "$GUIDE_TOKEN" ]; then
            echo "::warning::GUIDE_RELEASE_TOKEN is not set, so the release was not published to the guide site."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the app release
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          # The Windows zip stays on the app repository; the app's Check for
          # updates installs from the setup file.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.apk' --pattern '*.apk.sha256' \
            --pattern '*-windows-setup.exe' --pattern '*-windows-setup.exe.sha256'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body \
            --jq '.name' > "$RUNNER_TEMP/title.txt"
          # Pre-release if the app release is marked so, or the tag has a hyphen.
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
          case "$TAG" in *-*) pre=true ;; esac
          echo "$pre" > "$RUNNER_TEMP/prerelease.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body \
            --jq '.body' | grep -v '\.aab' > "$RUNNER_TEMP/notes.md"
          ls -l dist

      - name: Publish on the guide repository
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GUIDE_RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$(cat "$RUNNER_TEMP/prerelease.txt")" = "true" ]; then
            # A test version: Pre-release, never latest.
            mark="--prerelease"
            edit_mark="--prerelease --latest=false"
          else
            mark="--latest"
            edit_mark="--prerelease=false"
          fi
          if gh release view "$TAG" --repo "$GUIDE_REPO" > /dev/null 2>&1; then
            # Already there (a re-run): replace the files and notes.
            gh release upload "$TAG" dist/* --repo "$GUIDE_REPO" --clobber
            gh release edit "$TAG" --repo "$GUIDE_REPO" --notes-file "$RUNNER_TEMP/notes.md" $edit_mark
          else
            gh release create "$TAG" dist/* --repo "$GUIDE_REPO" --target main \
              --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --notes-file "$RUNNER_TEMP/notes.md" $mark
          fi
          echo "Published: https://github.com/$GUIDE_REPO/releases/tag/$TAG"
