name: Release

# Push a tag such as v0.24.0 to publish a GitHub Release with the signed APK
# and that version's CHANGELOG.md section.
#
# A tag with a hyphen, such as v0.36.0-beta.1 or v1.0.0-rc.1, is a test
# version (Semantic Versioning pre-release). It is built and published the
# same way except that: the release is marked Pre-release (never "latest", so
# the app's Check for updates ignores it), no Google Play bundle is built or
# attached, and the guide site copy is marked Pre-release too. See
# docs/BUILD.md > Test releases.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-pre.release."
            exit 1
          fi
          pubspec=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          app=$(grep -o "appVersion = '[^ ']*" lib/domain/app_settings.dart | sed "s/appVersion = '//")
          echo "tag=$tag pubspec=$pubspec app=$app"
          if [ "$tag" != "$pubspec" ] || [ "$tag" != "$app" ]; then
            echo "::error::Tag v$tag does not match pubspec.yaml ($pubspec) and appVersion ($app)."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # Anything after a hyphen makes it a test version.
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract release notes
        run: python3 scripts/release_notes.py "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CST_KEYSTORE_BASE64 is not set. Releases must be signed with the release key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CST_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CST_KEYSTORE_PASSWORD: ${{ secrets.CST_KEYSTORE_PASSWORD }}
          CST_KEY_ALIAS: ${{ secrets.CST_KEY_ALIAS }}
          CST_KEY_PASSWORD: ${{ secrets.CST_KEY_PASSWORD }}
        run: flutter build apk --release

      # The Android App Bundle that Google Play needs. Signed with the same
      # release key, which Play uses as the upload key. Not built for a test
      # version: it is not for Google Play, and an upload there is a manual
      # step for a real release.
      - name: Build release App Bundle for Google Play
        if: steps.version.outputs.prerelease != 'true'
        env:
          CST_KEYSTORE_PASSWORD: ${{ secrets.CST_KEYSTORE_PASSWORD }}
          CST_KEY_ALIAS: ${{ secrets.CST_KEY_ALIAS }}
          CST_KEY_PASSWORD: ${{ secrets.CST_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Name the APK and bundle and record the APK checksum
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Church-Service-Timer-$version.apk"
          (cd dist && sha256sum "Church-Service-Timer-$version.apk" > "Church-Service-Timer-$version.apk.sha256")
          if [ "${{ steps.version.outputs.prerelease }}" != "true" ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/Church-Service-Timer-$version.aab"
          fi
          update_hint=" A PC with 0.34.0 or later can instead use Settings › About › **Check for updates** › **Download and install**."
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            update_hint=" Install it over your current copy."
          fi
          {
            echo
            echo "---"
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
              echo "**Test version.** This is a pre-release for trying before the real release. Check for updates in the app does not offer it, and it is not the latest version."
              echo
            fi
            echo "**Android:** download \`Church-Service-Timer-$version.apk\` on the phone and open it (Android 7.0 or newer)."
            echo
            echo "**Windows:** download \`Church-Service-Timer-$version-windows-setup.exe\` on the PC and open it (64-bit Windows 10 or 11). It is not code-signed, so Windows may say \"Windows protected your PC\" the first time: choose **More info**, then **Run anyway**.${update_hint}"
            if [ "${{ steps.version.outputs.prerelease }}" != "true" ]; then
              echo
              echo "The \`.aab\` file is the bundle uploaded to Google Play; it can't be installed directly."
            fi
            echo
            echo "APK SHA-256: \`$(cut -d' ' -f1 "dist/Church-Service-Timer-$version.apk.sha256")\`"
          } >> "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          # A test version is marked Pre-release, which also keeps it from
          # being "latest" (the app's Check for updates reads the latest).
          flags=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Church Service Timer $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag $flags

  # The Windows app: a zip of the program folder and an installer, each with
  # a .sha256 checksum file, added to the GitHub Release once it exists. It runs after the Android release is
  # published, so a Windows problem can never hold up or change the APK.
  # Neither file is code-signed; Windows SmartScreen warns the first time.
  # The installer and its checksum are then copied to the public guide site
  # by the guide job below; the zip stays here.
  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package the zip and the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./scripts/Package-Windows.ps1 -Version "$("$env:GITHUB_REF_NAME".TrimStart('v'))"

      - name: Add the Windows files to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem dist/Church-Service-Timer-*-windows-*).FullName --clobber

  # Copy the release to the public guide site's Releases (see
  # publish-to-guide.yml), including the Windows installer once the windows
  # job has added it. If the Windows build fails, the APK is still
  # published. Skipped with a warning if GUIDE_RELEASE_TOKEN is not set.
  guide:
    needs: [release, windows]
    if: ${{ always() && needs.release.result == 'success' }}
    uses: ./.github/workflows/publish-to-guide.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      GUIDE_RELEASE_TOKEN: ${{ secrets.GUIDE_RELEASE_TOKEN }}
