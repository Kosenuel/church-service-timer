name: church_service_timer
description: Church service timer with a 32 by 16 simulator and W2 Wi-Fi display support.
publish_to: none
version: 0.37.0+42
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  pdf: ^3.13.1
  printing: ^5.15.1
  cryptography: ^2.8.1
  pointycastle: ^4.0.0
  nsd: ^5.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter:
    sdk: flutter
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  file_selector_windows: ^0.9.3+6
  file_selector_platform_interface: ^2.7.0
  ffi: ^2.2.0
  image: ^4.12.0
  # A patched copy: the published package ignores `silent` on Windows.
  local_notifier:
    path: third_party/local_notifier
dev_dependencies:
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/OFL-Tinos.txt
    - assets/bible/kjv.txt.gz
    - assets/lyrics/photos/
    - assets/lyrics/photos/thumbs/
    - assets/finish/
    - CHANGELOG.md
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # The LED text face, for cue buttons that show a cue as the stage does.
    # The same file the Android and Windows display code loads.
    - family: Tinos
      fonts:
        - asset: android/app/src/main/assets/display_fonts/tinos/Tinos-Bold.ttf
          weight: 700
