name: church_service_timer
description: Church service timer with a 32 by 16 simulator and W2 Wi-Fi display support.
publish_to: none
version: 0.30.1+33
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  pdf: ^3.13.1
  printing: ^5.15.1
  cryptography: ^2.8.1
  pointycastle: ^4.0.0
  nsd: ^5.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter:
    sdk: flutter
  share_plus: ^13.3.1
  path_provider: ^2.1.6
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/OFL-Tinos.txt
    - CHANGELOG.md
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
