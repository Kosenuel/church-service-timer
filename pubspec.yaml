name: church_service_timer
description: Church service timer with a 32 by 16 simulator and W2 Wi-Fi display support.
publish_to: none
version: 0.16.0+16
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  cryptography: ^2.8.1
  pointycastle: ^4.0.0
  nsd: ^5.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/OFL-Tinos.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
