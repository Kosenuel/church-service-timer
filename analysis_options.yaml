include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
    - third_party/**
linter:
  rules:
    # Brace-less single-statement ifs are used deliberately throughout.
    curly_braces_in_flow_control_structures: false
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    empty_catches: true
